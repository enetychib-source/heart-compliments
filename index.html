<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сердце комплиментов</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #heart-wrapper {
      position: relative;
      /* Адаптивный размер под экран телефона */
      width: 96vmin;
      height: 88vmin;
      max-width: 680px;
      max-height: 620px;
      animation: heartbeat 1.4s infinite ease-in-out;
    }

    .compliment-word {
      position: absolute;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-weight: 700;
      user-select: none;
      animation: glow 2.5s infinite alternate ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.06);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.03);
      }
    }

    @keyframes glow {
      0% {
        color: #ff2a2a;
        text-shadow: 0 0 6px rgba(255, 42, 42, 0.7);
        opacity: 0.78;
      }
      100% {
        color: #ff6b4a;
        text-shadow: 0 0 14px rgba(255, 90, 50, 1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div id="heart-wrapper"></div>

  <script>
    // Замените или дополните этот список своими комплиментами
    const compliments = [
      "Ты чудо",
      "Неотразимая",
      "Солнышко",
      "Нежная",
      "Очаровательная",
      "Моё вдохновение",
      "Самая лучшая",
      "Светлая",
      "Удивительная",
      "Родная",
      "Волшебная",
      "Идеальная",
      "Милая",
      "Прекрасная",
      "Счастье рядом",
      "Твоя улыбка"
    ];

    const wrapper = document.getElementById('heart-wrapper');
    const rows = 24; // Больше строк — плотнее заполнение
    const cols = 16; // Меньше колонок — больше места для длинных слов

    // Математическая формула сердца: (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
    for (let r = 0; r < rows; r++) {
      const y = 1.25 - (r / (rows - 1)) * 2.55;

      for (let c = 0; c < cols; c++) {
        const x = -1.3 + (c / (cols - 1)) * 2.6;

        const formula = Math.pow(x * x + y * y - 1, 3) - (x * x * Math.pow(y, 3));

        if (formula <= 0) {
          const span = document.createElement('span');
          span.className = 'compliment-word';
          span.textContent = compliments[Math.floor(Math.random() * compliments.length)];

          const leftPercent = ((x + 1.3) / 2.6) * 100;
          const topPercent = ((1.25 - y) / 2.55) * 100;

          span.style.left = `${leftPercent}%`;
          span.style.top = `${topPercent}%`;

          // Размер шрифта подстроен под комплименты на телефоне
          const fontSize = (1.15 + Math.random() * 0.55).toFixed(2);
          span.style.fontSize = `${fontSize}vmin`;
          span.style.animationDelay = `${(Math.random() * 2).toFixed(2)}s`;

          wrapper.appendChild(span);
        }
      }
    }
  </script>
</body>
</html>
